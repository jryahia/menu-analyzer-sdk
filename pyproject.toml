[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "menu-analyzer"
version = "0.1.0"
description = "AI Menu Analyzer SDK — OCR + dish analysis in 64 languages via GPT-4 Vision"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["menu", "ocr", "gpt4", "vision", "restaurant", "food", "multilingual", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/yourorg/menu-analyzer"
Issues = "https://github.com/yourorg/menu-analyzer/issues"

[tool.hatch.build.targets.wheel]
packages = ["menu_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
